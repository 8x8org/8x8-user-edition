plugins { id 'com.android.application' }

def ownerSignerFields = [
    System.getenv('EIGHTX8_ANDROID_SIGNING_KEYSTORE_FILE'),
    System.getenv('EIGHTX8_ANDROID_SIGNING_STORE_PASSWORD'),
    System.getenv('EIGHTX8_ANDROID_SIGNING_KEY_ALIAS'),
    System.getenv('EIGHTX8_ANDROID_SIGNING_KEY_PASSWORD')
]
def anyOwnerSigner = ownerSignerFields.any { it != null && !it.trim().isEmpty() }
def completeOwnerSigner = ownerSignerFields.every { it != null && !it.trim().isEmpty() }
if (anyOwnerSigner && !completeOwnerSigner)
    throw new GradleException('8x8 signing configuration incomplete (fail closed)')
if ('true'.equals(System.getenv('EIGHTX8_REQUIRE_STABLE_SIGNING')) && !completeOwnerSigner)
    throw new GradleException('Stable signing required but not configured')

android {
    namespace 'world.eightx8.user'
    compileSdk 35
    defaultConfig {
        applicationId 'world.eightx8.user'
        minSdk 26
        targetSdk 35
        versionCode 20051
        versionName '0.2.1-v50-media-rc1'
        manifestPlaceholders = [eightx8AppLabel: '8x8 OS']
        def home = project.findProperty('EIGHTX8_BASE_URL') ?: 'https://8x8-os-ecosystem.vercel.app'
        buildConfigField 'String', 'HOME_URL', '"' + home + '"'
    }
    signingConfigs {
        ownerPromoted {
            if (completeOwnerSigner) {
                storeFile file(ownerSignerFields[0])
                storePassword ownerSignerFields[1]
                keyAlias ownerSignerFields[2]
                keyPassword ownerSignerFields[3]
            }
        }
    }
    buildFeatures { buildConfig true }
    buildTypes {
        debug { applicationIdSuffix '.dev'; versionNameSuffix '-dev' }
        // Distinct preview identity: installs alongside older .dev builds whose
        // signing key can differ between GitHub Actions and physical devices.
        // Never substitute a different key for a production in-place update.
        preview {
            initWith debug
            applicationIdSuffix '.preview'
            versionNameSuffix '-preview'
            matchingFallbacks = ['debug']
            manifestPlaceholders = [eightx8AppLabel: '8x8 Preview']
        }
        release {
            minifyEnabled false
            // No owner signing credentials: preserve existing unsigned CI artifact.
            // A promoted official release requires protected external signing secrets.
            if (completeOwnerSigner) signingConfig signingConfigs.ownerPromoted
        }
    }
}
