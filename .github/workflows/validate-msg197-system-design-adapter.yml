name: Validate MSG197 System Design Knowledge Adapter

on:
  pull_request:
    paths:
      - "research/external-capabilities/candidates/system-design-primer/**"
      - "scripts/validate_msg197_system_design_adapter.py"
      - ".github/workflows/validate-msg197-system-design-adapter.yml"
  push:
    branches:
      - feature/msg197-k001-system-design-knowledge-adapter-v1
    paths:
      - "research/external-capabilities/candidates/system-design-primer/**"
      - "scripts/validate_msg197_system_design_adapter.py"
      - ".github/workflows/validate-msg197-system-design-adapter.yml"

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"

jobs:
  validate:
    name: Validate static knowledge adapter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Parse governed JSON
        run: |
          python3 -m json.tool research/external-capabilities/candidates/system-design-primer/MANIFEST.json >/dev/null
          python3 -m json.tool research/external-capabilities/candidates/system-design-primer/INDEX.json >/dev/null
          python3 -m json.tool research/external-capabilities/candidates/system-design-primer/RECEIPT.json >/dev/null

      - name: Compile validator
        run: python3 -m py_compile scripts/validate_msg197_system_design_adapter.py

      - name: Validate adapter
        run: python3 scripts/validate_msg197_system_design_adapter.py

      - name: Confirm static zero-action boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test ! -d research/external-capabilities/candidates/system-design-primer/vendor
          test ! -d research/external-capabilities/candidates/system-design-primer/node_modules
          test ! -d research/external-capabilities/candidates/system-design-primer/.venv
          if grep -RInE '(subprocess\.|os\.system|shell=True|curl |wget |ssh |scp |npm install|pip install|docker run|vercel deploy|gh pr merge)' \
            scripts/validate_msg197_system_design_adapter.py \
            research/external-capabilities/candidates/system-design-primer; then
            echo "Executable or mutating pattern found in static adapter"
            exit 1
          fi
