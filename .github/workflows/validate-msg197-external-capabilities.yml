name: Validate MSG197 External Capability Intake

on:
  pull_request:
    paths:
      - "research/external-capabilities/**"
      - "scripts/validate_msg197_external_capabilities.py"
      - ".github/workflows/validate-msg197-external-capabilities.yml"
  push:
    branches:
      - feature/msg197-external-capability-intake-v1
    paths:
      - "research/external-capabilities/**"
      - "scripts/validate_msg197_external_capabilities.py"
      - ".github/workflows/validate-msg197-external-capabilities.yml"

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"

jobs:
  validate:
    name: Validate static intake contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Parse governed JSON
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m json.tool research/external-capabilities/REPOSITORY_CENSUS.json >/dev/null
          python3 -m json.tool research/external-capabilities/INTEGRATION_BACKLOG.json >/dev/null
          python3 -m json.tool research/external-capabilities/receipts/MSG197_INTAKE_RECEIPT.json >/dev/null

      - name: Compile validator
        run: python3 -m py_compile scripts/validate_msg197_external_capabilities.py

      - name: Validate MSG197 intake
        run: python3 scripts/validate_msg197_external_capabilities.py

      - name: Enforce static zero-action boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          if grep -RInE '(subprocess\.|os\.system|shell=True|curl |wget |ssh |scp |rsync |npm install|pip install|docker run|kubectl|terraform apply|psql |gh pr merge|vercel deploy)' \
            scripts/validate_msg197_external_capabilities.py \
            research/external-capabilities; then
            echo "Executable or mutating pattern found in the MSG197 static intake package"
            exit 1
          fi

      - name: Confirm no candidate code was vendored
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(find research/external-capabilities -type f | wc -l)" -le 20
          test ! -d research/external-capabilities/vendor
          test ! -d research/external-capabilities/node_modules
          test ! -d research/external-capabilities/.venv
