name: Validate MSG197 External Capability Intake

on:
  pull_request:
    paths:
      - "research/external-capabilities/**"
      - "scripts/validate_msg197_external_capabilities.py"
      - "scripts/validate_msg197_council_001.py"
      - ".github/workflows/validate-msg197-external-capabilities.yml"
  push:
    branches:
      - main
      - feature/msg197-external-capability-intake-v1
      - feature/msg197-scalable-intake-validation-v1
      - feature/msg197-council-hardening-v2
    paths:
      - "research/external-capabilities/**"
      - "scripts/validate_msg197_external_capabilities.py"
      - "scripts/validate_msg197_council_001.py"
      - ".github/workflows/validate-msg197-external-capabilities.yml"

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"

jobs:
  validate:
    name: Validate intake and candidate boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Parse governed JSON
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m json.tool research/external-capabilities/REPOSITORY_CENSUS.json >/dev/null
          python3 -m json.tool research/external-capabilities/INTEGRATION_BACKLOG.json >/dev/null
          python3 -m json.tool research/external-capabilities/receipts/MSG197_INTAKE_RECEIPT.json >/dev/null
          python3 -m json.tool research/external-capabilities/council/COUNCIL_SESSION.json >/dev/null
          python3 -m json.tool research/external-capabilities/council/receipts/MSG197_COUNCIL_001_RECEIPT.json >/dev/null

      - name: Compile deterministic validators
        run: |
          python3 -m py_compile scripts/validate_msg197_external_capabilities.py
          python3 -m py_compile scripts/validate_msg197_council_001.py

      - name: Validate MSG197 parent intake
        run: python3 scripts/validate_msg197_external_capabilities.py

      - name: Validate MSG197 council framework
        run: python3 scripts/validate_msg197_council_001.py

      - name: Enforce validator zero-action boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          if grep -InE '(subprocess\.|os\.system|shell=True|curl|wget|ssh|scp|rsync|npm.*install|pip.*install|docker.*run|kubectl|terraform.*apply|psql|gh.*pr.*merge|vercel.*deploy)' \
            scripts/validate_msg197_external_capabilities.py \
            scripts/validate_msg197_council_001.py; then
            echo "Executable or mutating pattern found in MSG197 validators"
            exit 1
          fi

      - name: Confirm no runtime environments were committed
        shell: bash
        run: |
          set -Eeuo pipefail
          forbidden="$({ find research/external-capabilities -type d \
            \( -name vendor -o -name node_modules -o -name .venv -o -name venv -o -name env \
               -o -name .tox -o -name __pycache__ -o -name site-packages \
               -o -name target -o -name dist -o -name build \) \
            -print; } | sort)"
          if [ -n "$forbidden" ]; then
            printf 'Forbidden generated or runtime directories:\n%s\n' "$forbidden"
            exit 1
          fi

      - name: Report scalable evidence census
        shell: bash
        run: |
          set -Eeuo pipefail
          candidate_dirs="$(find research/external-capabilities/candidates -mindepth 1 -maxdepth 1 -type d | wc -l)"
          evidence_files="$(find research/external-capabilities -type f | wc -l)"
          evidence_bytes="$(find research/external-capabilities -type f -printf '%s\n' | awk '{total += $1} END {print total + 0}')"
          echo "candidate_directories=$candidate_dirs evidence_files=$evidence_files evidence_bytes=$evidence_bytes"
          test "$candidate_dirs" -ge 1
