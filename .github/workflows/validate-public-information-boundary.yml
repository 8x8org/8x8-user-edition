name: Validate Public Information Boundary

on:
  pull_request:
  push:
    branches:
      - main
      - security/public-private-boundary-remediation-v2

permissions:
  contents: read

jobs:
  validate:
    name: Reject private operational topology
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact submitted head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Compile validator and tests
        run: |
          python3 -m py_compile scripts/validate_public_information_boundary.py
          python3 -m py_compile tests/test_public_information_boundary.py

      - name: Validate public boundary
        run: python3 scripts/validate_public_information_boundary.py

      - name: Run boundary contracts
        run: python3 -m unittest tests.test_public_information_boundary -v
