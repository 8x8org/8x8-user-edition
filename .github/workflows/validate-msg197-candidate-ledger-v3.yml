name: Validate MSG197 Candidate Ledger V3

on:
  pull_request:
    paths:
      - "research/external-capabilities/CANDIDATE_STATUS_LEDGER_V3.json"
      - "research/external-capabilities/MSG197_CURRENT_STATUS_V3.md"
      - "scripts/validate_msg197_candidate_ledger_v3.py"
      - ".github/workflows/validate-msg197-candidate-ledger-v3.yml"
  push:
    branches:
      - feature/msg197-canonical-ledger-v3
      - main
    paths:
      - "research/external-capabilities/CANDIDATE_STATUS_LEDGER_V3.json"
      - "research/external-capabilities/MSG197_CURRENT_STATUS_V3.md"
      - "scripts/validate_msg197_candidate_ledger_v3.py"
      - ".github/workflows/validate-msg197-candidate-ledger-v3.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python3 -m json.tool research/external-capabilities/CANDIDATE_STATUS_LEDGER_V3.json >/dev/null
      - run: python3 scripts/validate_msg197_candidate_ledger_v3.py
      - run: sha256sum research/external-capabilities/CANDIDATE_STATUS_LEDGER_V3.json research/external-capabilities/MSG197_CURRENT_STATUS_V3.md scripts/validate_msg197_candidate_ledger_v3.py
