name: Browser Quality Gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Test local Studio media and public PWA cache boundaries
        run: node --test tests/media-core.test.mjs tests/service-worker.test.mjs tests/agent-room.test.mjs tests/android-update-contract.test.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser and accessibility gates
        run: npm run test:browser
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          if-no-files-found: ignore
