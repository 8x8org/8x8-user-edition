name: Validate MSG197 Supervision Adapter Contract

on:
  pull_request:
    paths:
      - "adapters/supervision/**"
      - "tests/test_msg197_supervision_adapter.py"
      - ".github/workflows/validate-msg197-supervision-adapter.yml"
  push:
    branches:
      - main
      - feature/msg197-vision-002-supervision-adapter
    paths:
      - "adapters/supervision/**"
      - "tests/test_msg197_supervision_adapter.py"
      - ".github/workflows/validate-msg197-supervision-adapter.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Parse governed JSON
        run: |
          python3 -m json.tool adapters/supervision/manifest.json >/dev/null
          python3 -m json.tool adapters/supervision/request.schema.json >/dev/null
          python3 -m json.tool adapters/supervision/response.schema.json >/dev/null
          python3 -m json.tool adapters/supervision/synthetic-fixture.json >/dev/null
      - name: Run deterministic contract tests
        run: python3 -m unittest tests.test_msg197_supervision_adapter -v
      - name: Enforce disabled runtime boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('adapters/supervision/manifest.json').read_text())
          assert manifest['enabled'] is False
          assert manifest['install_state'] == 'NOT_INSTALLED'
          assert manifest['runtime_authority'] == 'NONE'
          assert manifest['production_ready'] is False
          PY
