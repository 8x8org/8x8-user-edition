name: Validate Paper Trading

on:
  pull_request:
    paths:
      - "trading/**"
      - "tests/test_paper_engine.py"
      - ".github/workflows/validate-paper-trading.yml"
  push:
    branches:
      - main
    paths:
      - "trading/**"
      - "tests/test_paper_engine.py"
      - ".github/workflows/validate-paper-trading.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-paper-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact submitted head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Assert exact head
        shell: bash
        run: |
          set -Eeuo pipefail
          EXPECTED='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}'
          OBSERVED="$(git rev-parse HEAD)"
          test "$OBSERVED" = "$EXPECTED"
          printf 'expected_head=%s\nobserved_head=%s\n' "$EXPECTED" "$OBSERVED"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Run deterministic regression suite
        run: python -B -m unittest tests/test_paper_engine.py -v
      - name: Generate reproducible paper receipt twice
        run: |
          set -Eeuo pipefail
          python -B trading/paper_engine.py > /tmp/receipt-a.json
          python -B trading/paper_engine.py > /tmp/receipt-b.json
          cmp /tmp/receipt-a.json /tmp/receipt-b.json
          python -m json.tool /tmp/receipt-a.json >/dev/null
      - name: Generate commercial scenario fixture
        run: |
          set -Eeuo pipefail
          python -B trading/commercial_model.py > /tmp/commercial.json
          python -m json.tool /tmp/commercial.json >/dev/null
      - name: Fail closed if live financial adapters appear in paper modules
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import pathlib
          import re
          import sys

          root = pathlib.Path('trading')
          patterns = [
              re.compile(r'ccxt', re.IGNORECASE),
              re.compile(r'web3\.HTTPProvider', re.IGNORECASE),
              re.compile(r'send_raw_transaction', re.IGNORECASE),
              re.compile(r'sendTransaction', re.IGNORECASE),
              re.compile(r'private[_ -]?key', re.IGNORECASE),
              re.compile(r'seed phrase', re.IGNORECASE),
              re.compile(r'mnemonic', re.IGNORECASE),
              re.compile(r'exchange api', re.IGNORECASE),
          ]
          violations = []
          try:
              files = sorted(path for path in root.rglob('*') if path.is_file())
              if not files:
                  raise RuntimeError('trading scan found no files')
              for path in files:
                  try:
                      text = path.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  for pattern in patterns:
                      if pattern.search(text):
                          violations.append(f'{path}:{pattern.pattern}')
          except Exception as exc:
              print(f'PAPER_BOUNDARY_SCAN=ERROR detail={exc}', file=sys.stderr)
              raise
          if violations:
              print('PAPER_BOUNDARY_SCAN=FAIL', file=sys.stderr)
              for violation in violations:
                  print(violation, file=sys.stderr)
              raise SystemExit(1)
          print(f'PAPER_BOUNDARY_SCAN=PASS files={len(files)}')
          PY
      - name: Verify checkout stayed clean
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"
