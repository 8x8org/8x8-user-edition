name: Validate Paper Trading

on:
  pull_request:
    paths:
      - "trading/**"
      - "tests/test_paper_engine.py"
      - ".github/workflows/validate-paper-trading.yml"
  push:
    branches:
      - feature/msg326-deterministic-paper-risk-engine-v1
    paths:
      - "trading/**"
      - "tests/test_paper_engine.py"
      - ".github/workflows/validate-paper-trading.yml"

permissions:
  contents: read

jobs:
  deterministic-paper-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact submitted head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Run deterministic regression suite
        run: python -B -m unittest tests/test_paper_engine.py -v
      - name: Generate reproducible paper receipt twice
        run: |
          python -B trading/paper_engine.py > /tmp/receipt-a.json
          python -B trading/paper_engine.py > /tmp/receipt-b.json
          cmp /tmp/receipt-a.json /tmp/receipt-b.json
          python -m json.tool /tmp/receipt-a.json >/dev/null
      - name: Generate commercial scenario fixture
        run: |
          python -B trading/commercial_model.py > /tmp/commercial.json
          python -m json.tool /tmp/commercial.json >/dev/null
      - name: Fail if live financial adapters appear in paper modules
        run: |
          ! grep -RniE 'ccxt|web3\.HTTPProvider|send_raw_transaction|sendTransaction|private[_ -]?key|seed phrase|mnemonic|exchange api' trading/
      - name: Verify checkout stayed clean
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"
