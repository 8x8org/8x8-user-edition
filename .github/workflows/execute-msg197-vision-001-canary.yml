name: Execute MSG197 Supervision No-Model Canary

on:
  pull_request:
    paths:
      - "research/external-capabilities/candidates/supervision/**"
      - "scripts/canary/run_msg197_vision_001.py"
      - "scripts/validate_msg197_vision_001_canary.py"
      - ".github/workflows/execute-msg197-vision-001-canary.yml"
  push:
    branches:
      - feature/msg197-vision-001-external-canary-v1
    paths:
      - "research/external-capabilities/candidates/supervision/**"
      - "scripts/canary/run_msg197_vision_001.py"
      - "scripts/validate_msg197_vision_001_canary.py"
      - ".github/workflows/execute-msg197-vision-001-canary.yml"

permissions:
  contents: read

env:
  PIN: bc20dd19fbc7b6cceaec447f1182346ca9158523
  PIP_AUDIT_VERSION: "2.7.3"
  PIP_VERSION: "25.2"
  SETUPTOOLS_VERSION: "80.9.0"
  WHEEL_VERSION: "0.45.1"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  canary:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python:
          - "3.11"
          - "3.12"

    steps:
      - name: Checkout exact 8x8 packet
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}

      - name: Validate static execution contract
        run: python3 scripts/validate_msg197_vision_001_canary.py

      - name: Initialize isolated paths
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="/tmp/msg197-vision-${{ matrix.python }}"
          EVIDENCE="$GITHUB_WORKSPACE/research/external-capabilities/candidates/supervision/canary-evidence/py${{ matrix.python }}"
          rm -rf "$ROOT" "$EVIDENCE"
          mkdir -p "$ROOT" "$EVIDENCE"
          printf '%s\n' "$ROOT" > "$RUNNER_TEMP/msg197_vision_root"
          printf '%s\n' "$EVIDENCE" > "$RUNNER_TEMP/msg197_vision_evidence"
          python3 --version
          python3 -m pip --version
          df -B1 "$RUNNER_TEMP" > "$EVIDENCE/df-before.txt"

      - name: Fetch immutable sparse upstream source
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$(cat "$RUNNER_TEMP/msg197_vision_root")"
          EVIDENCE="$(cat "$RUNNER_TEMP/msg197_vision_evidence")"
          SOURCE="$ROOT/upstream"
          git init "$SOURCE"
          git -C "$SOURCE" remote add origin https://github.com/roboflow/supervision.git
          git -C "$SOURCE" -c protocol.version=2 fetch --depth=1 --filter=blob:none origin "$PIN"
          git -C "$SOURCE" sparse-checkout init --cone
          git -C "$SOURCE" sparse-checkout set src
          git -C "$SOURCE" checkout --detach FETCH_HEAD
          test "$(git -C "$SOURCE" rev-parse HEAD)" = "$PIN"
          git -C "$SOURCE" status --short --branch > "$EVIDENCE/upstream-status.txt"
          find "$SOURCE" -type f -print0 | sort -z | xargs -0 sha256sum > "$EVIDENCE/upstream-sparse-sha256.txt"

      - name: Resolve wheels and install isolated audit environment
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$(cat "$RUNNER_TEMP/msg197_vision_root")"
          EVIDENCE="$(cat "$RUNNER_TEMP/msg197_vision_evidence")"
          SOURCE="$ROOT/upstream"
          TOOLING="$ROOT/tooling"
          EXEC="$ROOT/exec"
          WHEELS="$ROOT/wheelhouse"
          mkdir -p "$WHEELS"

          python3 -m venv "$TOOLING"
          "$TOOLING/bin/python" -m pip install \
            "pip==$PIP_VERSION" \
            "setuptools==$SETUPTOOLS_VERSION" \
            "wheel==$WHEEL_VERSION" \
            "pip-audit==$PIP_AUDIT_VERSION"

          start_ns="$(date +%s%N)"
          "$TOOLING/bin/python" -m pip wheel --wheel-dir "$WHEELS" "$SOURCE"
          end_ns="$(date +%s%N)"
          printf '%s\n' "$(( (end_ns - start_ns) / 1000000 ))" > "$EVIDENCE/wheel-resolution-ms.txt"

          find "$WHEELS" -maxdepth 1 -type f -name '*.whl' -print0 \
            | sort -z | xargs -0 sha256sum > "$EVIDENCE/wheel-sha256.txt"
          find "$WHEELS" -maxdepth 1 -type f -name '*.whl' -printf '%f\t%s\n' \
            | sort > "$EVIDENCE/wheel-sizes.tsv"
          du -sb "$WHEELS" > "$EVIDENCE/wheelhouse-bytes.txt"

          python3 -m venv "$EXEC"
          start_ns="$(date +%s%N)"
          "$EXEC/bin/python" -m pip install \
            --no-index \
            --find-links "$WHEELS" \
            "supervision==0.31.0.dev0"
          end_ns="$(date +%s%N)"
          printf '%s\n' "$(( (end_ns - start_ns) / 1000000 ))" > "$EVIDENCE/install-ms.txt"

          "$EXEC/bin/python" -m pip freeze --all > "$EVIDENCE/resolved-distributions.txt"
          "$EXEC/bin/python" -m pip inspect --local > "$EVIDENCE/pip-inspect.json"
          du -sb "$EXEC" > "$EVIDENCE/venv-bytes.txt"

          SITE="$("$EXEC/bin/python" -c 'import site; print(site.getsitepackages()[0])')"
          set +e
          "$TOOLING/bin/pip-audit" \
            --path "$SITE" \
            --format json > "$EVIDENCE/pip-audit.json"
          audit_rc=$?
          set -e
          printf '%s\n' "$audit_rc" > "$EVIDENCE/pip-audit-exit.txt"

          "$TOOLING/bin/python" -m pip --version > "$EVIDENCE/tooling-pip-version.txt"
          "$TOOLING/bin/python" -c 'import setuptools; print(setuptools.__version__)' > "$EVIDENCE/setuptools-version.txt"
          "$TOOLING/bin/python" -c 'import wheel; print(wheel.__version__)' > "$EVIDENCE/wheel-version.txt"
          "$TOOLING/bin/pip-audit" --version > "$EVIDENCE/pip-audit-version.txt"

      - name: Build offline execution image
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$(cat "$RUNNER_TEMP/msg197_vision_root")"
          EVIDENCE="$(cat "$RUNNER_TEMP/msg197_vision_evidence")"
          CONTEXT="$ROOT/docker-context"
          IMAGE="msg197-vision-001:py${{ matrix.python }}"
          BASE_IMAGE="python:${{ matrix.python }}-slim-bookworm"

          mkdir -p "$CONTEXT/wheels"
          cp "$ROOT"/wheelhouse/*.whl "$CONTEXT/wheels/"
          cp scripts/canary/run_msg197_vision_001.py "$CONTEXT/benchmark.py"
          cat > "$CONTEXT/Dockerfile" <<'DOCKERFILE'
          ARG BASE_IMAGE
          FROM ${BASE_IMAGE}
          ENV PYTHONDONTWRITEBYTECODE=1
          ENV PYTHONUNBUFFERED=1
          ENV HOME=/tmp/home
          ENV MPLCONFIGDIR=/tmp/matplotlib
          COPY wheels /opt/wheels
          RUN python -m pip install --no-index --find-links=/opt/wheels supervision==0.31.0.dev0 \
              && rm -rf /opt/wheels /root/.cache
          COPY benchmark.py /opt/benchmark.py
          USER 65534:65534
          ENTRYPOINT ["python", "/opt/benchmark.py"]
          DOCKERFILE

          docker pull "$BASE_IMAGE"
          docker image inspect "$BASE_IMAGE" --format '{{json .RepoDigests}}' > "$EVIDENCE/base-image-digests.json"
          docker image inspect "$BASE_IMAGE" --format '{{.Id}}' > "$EVIDENCE/base-image-id.txt"

          docker build \
            --network=none \
            --build-arg "BASE_IMAGE=$BASE_IMAGE" \
            --tag "$IMAGE" \
            "$CONTEXT"
          docker image inspect "$IMAGE" --format '{{.Id}}' > "$EVIDENCE/canary-image-id.txt"
          docker image inspect "$IMAGE" --format '{{.Size}}' > "$EVIDENCE/canary-image-bytes.txt"

      - name: Run no-network read-only synthetic canary
        shell: bash
        run: |
          set -Eeuo pipefail
          EVIDENCE="$(cat "$RUNNER_TEMP/msg197_vision_evidence")"
          IMAGE="msg197-vision-001:py${{ matrix.python }}"

          timeout 30s docker run --rm \
            --network none \
            --read-only \
            --memory 768m \
            --cpus 1 \
            --pids-limit 128 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --user 65534:65534 \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            "$IMAGE" > "$EVIDENCE/benchmark-result.json"

          python3 -m json.tool "$EVIDENCE/benchmark-result.json" >/dev/null
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = Path(os.environ["RUNNER_TEMP"]).joinpath("msg197_vision_evidence").read_text().strip()
          result = json.loads(Path(evidence, "benchmark-result.json").read_text())
          assert result["truth_state"] == "PASS_SYNTHETIC_NO_MODEL_CANARY"
          assert result["backend"] == "fallback"
          assert result["model_packages_present"] == []
          assert result["network_policy"] == "DENIED_BY_CONTAINER_AND_PYTHON_GUARD"
          assert result["synthetic_detection_count"] == 3
          assert result["annotated_shape"] == [64, 64, 3]
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Emit machine-readable evidence summary
        shell: bash
        run: |
          set -Eeuo pipefail
          EVIDENCE="$(cat "$RUNNER_TEMP/msg197_vision_evidence")"
          df -B1 "$RUNNER_TEMP" > "$EVIDENCE/df-after-before-cleanup.txt"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import platform
          from pathlib import Path

          evidence = Path(Path(os.environ["RUNNER_TEMP"], "msg197_vision_evidence").read_text().strip())
          audit_raw = json.loads((evidence / "pip-audit.json").read_text())
          vulnerabilities = audit_raw if isinstance(audit_raw, list) else audit_raw.get("dependencies", [])
          vulnerable = []
          for item in vulnerabilities:
              vulns = item.get("vulns", []) if isinstance(item, dict) else []
              if vulns:
                  vulnerable.append({
                      "name": item.get("name"),
                      "version": item.get("version"),
                      "vulnerabilities": vulns,
                  })

          files = {}
          for path in sorted(evidence.iterdir()):
              if path.is_file():
                  files[path.name] = {
                      "bytes": path.stat().st_size,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  }

          summary = {
              "schema_version": "1.0.0",
              "mission_id": "MSG197-VISION-001",
              "source_pin": "bc20dd19fbc7b6cceaec447f1182346ca9158523",
              "python_lane": os.environ["MATRIX_PYTHON"],
              "runner": platform.platform(),
              "audit_exit_code": int((evidence / "pip-audit-exit.txt").read_text()),
              "vulnerable_distribution_count": len(vulnerable),
              "vulnerable_distributions": vulnerable,
              "benchmark": json.loads((evidence / "benchmark-result.json").read_text()),
              "artifacts": files,
              "truth_state": (
                  "PASS_FUNCTIONAL_CANARY_SUPPLY_CHAIN_BLOCKED"
                  if vulnerable
                  else "PASS_FUNCTIONAL_AND_SUPPLY_CHAIN_CANARY"
              ),
              "promotion_authorized": not vulnerable,
              "installed_candidate_count_on_8x8": 0,
              "model_downloads": 0,
              "private_media_used": False,
              "phone_changes": 0,
              "production_changes": 0,
          }
          (evidence / "CANARY_EVIDENCE_SUMMARY.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
        env:
          MATRIX_PYTHON: ${{ matrix.python }}

      - name: Upload exact lane evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: msg197-vision-001-py${{ matrix.python }}
          path: research/external-capabilities/candidates/supervision/canary-evidence/py${{ matrix.python }}
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce zero-vulnerability promotion gate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = Path(Path(os.environ["RUNNER_TEMP"], "msg197_vision_evidence").read_text().strip())
          summary = json.loads((evidence / "CANARY_EVIDENCE_SUMMARY.json").read_text())
          if summary["audit_exit_code"] != 0 or summary["vulnerable_distribution_count"] != 0:
              raise SystemExit(
                  "promotion blocked: "
                  f"audit_exit={summary['audit_exit_code']} "
                  f"vulnerable_distributions={summary['vulnerable_distribution_count']}"
              )
          print("promotion gate passed: zero vulnerabilities")
          PY

      - name: Cleanup and prove removal
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$(cat "$RUNNER_TEMP/msg197_vision_root" 2>/dev/null || true)"
          EVIDENCE="$(cat "$RUNNER_TEMP/msg197_vision_evidence" 2>/dev/null || true)"
          IMAGE="msg197-vision-001:py${{ matrix.python }}"

          docker ps -aq --filter "ancestor=$IMAGE" | xargs -r docker rm -f
          docker image rm -f "$IMAGE" >/dev/null 2>&1 || true
          if [ -n "$ROOT" ]; then
            rm -rf "$ROOT"
            test ! -e "$ROOT"
          fi
          python3 -m pip cache purge >/dev/null 2>&1 || true
          if [ -n "$EVIDENCE" ] && [ -d "$EVIDENCE" ]; then
            printf 'cleanup_status=PASS\n' > "$EVIDENCE/cleanup-status.txt"
          fi
