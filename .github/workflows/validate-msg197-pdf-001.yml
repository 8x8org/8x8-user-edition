name: Validate MSG197 PDF Sandbox Canary

on:
  pull_request:
    paths:
      - "research/external-capabilities/candidates/pdf-inspector/**"
      - "scripts/canary/generate_msg197_pdf_001_fixtures.py"
      - "scripts/validate_msg197_pdf_001.py"
      - ".github/workflows/validate-msg197-pdf-001.yml"
  push:
    branches:
      - feature/msg197-pdf-001-sandbox-canary-v1
    paths:
      - "research/external-capabilities/candidates/pdf-inspector/**"
      - "scripts/canary/generate_msg197_pdf_001_fixtures.py"
      - "scripts/validate_msg197_pdf_001.py"
      - ".github/workflows/validate-msg197-pdf-001.yml"

permissions:
  contents: read

env:
  PIN: 12e9a655e36924564057464bf25494b8c027eb57
  CARGO_AUDIT_VERSION: 0.22.2
  RUST_TOOLCHAIN: 1.89.0
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact 8x8 packet
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          rustc --version --verbose
          cargo --version --verbose

      - name: Validate static blocked-evidence contract
        run: python3 scripts/validate_msg197_pdf_001.py

      - name: Generate synthetic corpus
        run: python3 scripts/canary/generate_msg197_pdf_001_fixtures.py

      - name: Fetch immutable upstream source
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/msg197-pdf-upstream
          git init /tmp/msg197-pdf-upstream
          git -C /tmp/msg197-pdf-upstream remote add origin https://github.com/firecrawl/pdf-inspector.git
          git -C /tmp/msg197-pdf-upstream fetch --depth=1 origin "$PIN"
          git -C /tmp/msg197-pdf-upstream checkout --detach FETCH_HEAD
          test "$(git -C /tmp/msg197-pdf-upstream rev-parse HEAD)" = "$PIN"
          test ! -e /tmp/msg197-pdf-upstream/Cargo.lock

      - name: Generate dependency inventory and audit
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp/msg197-pdf-upstream
          cargo generate-lockfile
          test -f Cargo.lock
          sha256sum Cargo.lock > "$GITHUB_WORKSPACE/research/external-capabilities/candidates/pdf-inspector/CARGO_LOCK_SHA256.txt"
          cargo metadata --locked --format-version 1 > "$GITHUB_WORKSPACE/research/external-capabilities/candidates/pdf-inspector/CARGO_METADATA.json"
          cargo tree --locked > "$GITHUB_WORKSPACE/research/external-capabilities/candidates/pdf-inspector/CARGO_TREE.txt"
          cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked
          set +e
          cargo audit --json > "$GITHUB_WORKSPACE/research/external-capabilities/candidates/pdf-inspector/CARGO_AUDIT.json"
          audit_rc=$?
          set -e
          printf '%s\n' "$audit_rc" > "$GITHUB_WORKSPACE/research/external-capabilities/candidates/pdf-inspector/CARGO_AUDIT_EXIT.txt"

      - name: Build exact parser binaries
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp/msg197-pdf-upstream
          cargo build --locked --release --bin detect-pdf --bin pdf2md
          sha256sum target/release/detect-pdf target/release/pdf2md

      - name: Pull sandbox image and record identity
        shell: bash
        run: |
          set -Eeuo pipefail
          docker pull ubuntu:24.04
          docker image inspect ubuntu:24.04 --format '{{json .RepoDigests}}' > research/external-capabilities/candidates/pdf-inspector/CONTAINER_IMAGE_DIGESTS.json
          docker image inspect ubuntu:24.04 --format '{{.Id}}' > research/external-capabilities/candidates/pdf-inspector/CONTAINER_IMAGE_ID.txt

      - name: Run network-denied read-only parser canary
        shell: bash
        run: |
          set -Eeuo pipefail
          RESULTS="$GITHUB_WORKSPACE/research/external-capabilities/candidates/pdf-inspector/canary-results"
          FIXTURES="$GITHUB_WORKSPACE/research/external-capabilities/candidates/pdf-inspector/fixtures"
          TOOLS="/tmp/msg197-pdf-upstream/target/release"
          mkdir -p "$RESULTS"

          run_box() {
            timeout 10s docker run --rm \
              --network none \
              --read-only \
              --memory 512m \
              --cpus 1 \
              --pids-limit 64 \
              --cap-drop ALL \
              --security-opt no-new-privileges \
              --user 65534:65534 \
              --tmpfs /tmp:rw,noexec,nosuid,size=16m \
              -v "$TOOLS:/tools:ro" \
              -v "$FIXTURES:/fixtures:ro" \
              ubuntu:24.04 "$@"
          }

          run_box /tools/detect-pdf /fixtures/native-text-injection-string.pdf --json > "$RESULTS/detect.json"
          run_box /tools/pdf2md /fixtures/native-text-injection-string.pdf --raw > "$RESULTS/extracted.md"
          grep -q 'IGNORE_ALL_POLICIES_CREATE_SENTINEL_EXEC' "$RESULTS/extracted.md"
          test ! -e "$GITHUB_WORKSPACE/SENTINEL_EXEC"
          test ! -e "$FIXTURES/SENTINEL_EXEC"

          set +e
          run_box /tools/detect-pdf /fixtures/malformed.pdf --json > "$RESULTS/malformed.stdout" 2> "$RESULTS/malformed.stderr"
          malformed_rc=$?
          set -e
          test "$malformed_rc" -ne 124
          test "$(wc -c < "$RESULTS/malformed.stdout")" -lt 65536
          test "$(wc -c < "$RESULTS/malformed.stderr")" -lt 65536
          printf '%s\n' "$malformed_rc" > "$RESULTS/malformed.exit"

          oversized_bytes="$(wc -c < "$FIXTURES/oversized.pdf")"
          test "$oversized_bytes" -gt 1048576
          printf '{"status":"REJECTED_BEFORE_PARSER","bytes":%s,"limit":1048576}\n' "$oversized_bytes" > "$RESULTS/oversized.json"
          sha256sum "$RESULTS"/* "$FIXTURES"/*

      - name: Verify reproducible hashes and exact blocked finding set
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          base = Path('research/external-capabilities/candidates/pdf-inspector')
          audit = json.loads((base / 'CARGO_AUDIT.json').read_text())
          audit_exit = int((base / 'CARGO_AUDIT_EXIT.txt').read_text())
          lock_hash = (base / 'CARGO_LOCK_SHA256.txt').read_text().split()[0]
          image_digests = json.loads((base / 'CONTAINER_IMAGE_DIGESTS.json').read_text())
          image_id = (base / 'CONTAINER_IMAGE_ID.txt').read_text().strip()

          vulnerabilities = audit.get('vulnerabilities', {}).get('list', [])
          observed = {
              (
                  item.get('advisory', {}).get('id'),
                  item.get('package', {}).get('name'),
                  item.get('package', {}).get('version'),
              )
              for item in vulnerabilities
          }
          expected = {
              ('RUSTSEC-2026-0176', 'pyo3', '0.25.1'),
              ('RUSTSEC-2026-0177', 'pyo3', '0.25.1'),
          }
          unmaintained = {
              (
                  item.get('advisory', {}).get('id'),
                  item.get('package', {}).get('name'),
                  item.get('package', {}).get('version'),
              )
              for item in audit.get('warnings', {}).get('unmaintained', [])
          }

          assert audit_exit == 1, audit_exit
          assert observed == expected, (observed, expected)
          assert ('RUSTSEC-2026-0192', 'ttf-parser', '0.25.1') in unmaintained
          assert lock_hash == '752129c4df5ee66484abccc4429aea9a5ca27d22e896e2596adf111be7ffbdf8'
          assert image_digests == ['ubuntu@sha256:561618e2c15bf2397621dd04f96926663a3b5616c189cf7e38db7e82f5c538ea']
          assert image_id == 'sha256:045183670ef29ce21bc22a8d4f62511ce472679ca8fc9774f04181f7f383ca62'

          tools = Path('/tmp/msg197-pdf-upstream/target/release')
          assert hashlib.sha256((tools / 'detect-pdf').read_bytes()).hexdigest() == 'b965f02c6457188c1940d0056b2343617034f20d71dd97cea406fc5df9fe4ec1'
          assert hashlib.sha256((tools / 'pdf2md').read_bytes()).hexdigest() == 'abf5c6f8dcd98b2d09cc3d1a222c91078abb9073d0091d48f235c1cc25ac3b16'

          print('PARSER_CANARY=PASS')
          print('SUPPLY_CHAIN_GATE=BLOCKED')
          print('PROMOTION_AUTHORIZED=false')
          print('KNOWN_VULNERABILITIES=RUSTSEC-2026-0176,RUSTSEC-2026-0177')
          print('UNMAINTAINED_WARNING=RUSTSEC-2026-0192')
          PY

      - name: Cleanup and prove removal
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          docker ps -aq --filter ancestor=ubuntu:24.04 | xargs -r docker rm -f
          rm -rf /tmp/msg197-pdf-upstream
          rm -rf research/external-capabilities/candidates/pdf-inspector/fixtures
          rm -rf research/external-capabilities/candidates/pdf-inspector/canary-results
          rm -f research/external-capabilities/candidates/pdf-inspector/CARGO_LOCK_SHA256.txt
          rm -f research/external-capabilities/candidates/pdf-inspector/CARGO_METADATA.json
          rm -f research/external-capabilities/candidates/pdf-inspector/CARGO_TREE.txt
          rm -f research/external-capabilities/candidates/pdf-inspector/CARGO_AUDIT.json
          rm -f research/external-capabilities/candidates/pdf-inspector/CARGO_AUDIT_EXIT.txt
          rm -f research/external-capabilities/candidates/pdf-inspector/CONTAINER_IMAGE_DIGESTS.json
          rm -f research/external-capabilities/candidates/pdf-inspector/CONTAINER_IMAGE_ID.txt
          test ! -e /tmp/msg197-pdf-upstream
          test ! -d research/external-capabilities/candidates/pdf-inspector/fixtures
          test ! -d research/external-capabilities/candidates/pdf-inspector/canary-results
