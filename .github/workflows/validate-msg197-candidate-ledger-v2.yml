name: Validate MSG197 Candidate Status Ledger V2

on:
  pull_request:
    paths:
      - "research/external-capabilities/CANDIDATE_STATUS_LEDGER_V2.json"
      - "scripts/validate_msg197_candidate_ledger_v2.py"
      - ".github/workflows/validate-msg197-candidate-ledger-v2.yml"
  push:
    branches:
      - feature/msg197-canonical-ledger-v2
    paths:
      - "research/external-capabilities/CANDIDATE_STATUS_LEDGER_V2.json"
      - "scripts/validate_msg197_candidate_ledger_v2.py"
      - ".github/workflows/validate-msg197-candidate-ledger-v2.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python3 -m json.tool research/external-capabilities/CANDIDATE_STATUS_LEDGER_V2.json >/dev/null
      - run: python3 scripts/validate_msg197_candidate_ledger_v2.py
      - name: Print governed SHA-256
        run: sha256sum research/external-capabilities/CANDIDATE_STATUS_LEDGER_V2.json scripts/validate_msg197_candidate_ledger_v2.py .github/workflows/validate-msg197-candidate-ledger-v2.yml
      - name: Enforce zero-action boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          if grep -InE '(subprocess\.|os\.system|shell=True|curl|wget|ssh|scp|rsync|npm.*install|pip.*install|docker.*run|kubectl|terraform.*apply|psql|gh.*pr.*merge|vercel.*deploy)' scripts/validate_msg197_candidate_ledger_v2.py; then
            echo "Executable or mutating pattern found in ledger validator"
            exit 1
          fi
