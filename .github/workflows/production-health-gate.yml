name: Production Health Gate

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: production-health-gate
  cancel-in-progress: true

jobs:
  verify-public-carrier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public routes and browser-safe headers
        shell: bash
        run: |
          set -Eeuo pipefail
          base='https://8x8-os-ecosystem.vercel.app'
          routes=( '/' '/first-blink' '/world' '/art-board' )
          canonical_marker='Living Omniversal Gate R3'

          for route in "${routes[@]}"; do
            headers="$(mktemp)"
            body="$(mktemp)"
            status="$(curl -sS -L -D "$headers" -o "$body" -w '%{http_code}' "$base$route")"

            test "$status" = '200' || {
              echo "FAIL $route: HTTP $status"
              exit 1
            }

            grep -Eiq '^content-type:[[:space:]]*text/html' "$headers" || {
              echo "FAIL $route: expected text/html"
              cat "$headers"
              exit 1
            }

            if grep -Eiq '^content-disposition:.*attachment' "$headers"; then
              echo "FAIL $route: attachment disposition is forbidden"
              cat "$headers"
              exit 1
            fi

            grep -Fq '0.0.1 Beta' "$body" || {
              echo "FAIL $route: canonical 0.0.1 Beta marker missing"
              exit 1
            }

            grep -Fq "$canonical_marker" "$body" || {
              echo "FAIL $route: canonical interface marker missing: $canonical_marker"
              exit 1
            }

            echo "PASS $route HTTP=200 content-type=text/html canonical-version=0.0.1 interface='$canonical_marker'"
          done

      - name: Record provenance limitation
        run: |
          echo 'Route health is not deployment provenance.'
          echo 'Issue #106 remains the canonical source→artifact→deployment provenance gate.'
