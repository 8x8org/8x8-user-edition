name: KHRONAPEIRON-8 VERITAS

on:
  pull_request:
    paths:
      - 'fabric/khronapeiron8/**'
      - '.github/workflows/khronapeiron8-veritas.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  veritas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run KHRONAPEIRON-8 regression suite
        run: python3 -m unittest fabric.khronapeiron8.test_veritas -v
      - name: Run VERITAS executable
        run: python3 fabric/khronapeiron8/veritas.py
