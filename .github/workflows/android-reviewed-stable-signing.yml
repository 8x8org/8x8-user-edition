name: Android User Edition Reviewed Stable Signing
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    environment: signing-review
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify public build and update safety
        run: |
          python3 scripts/validate_public_information_boundary.py
          node --test tests/media-core.test.mjs tests/service-worker.test.mjs tests/agent-room.test.mjs tests/android-update-contract.test.mjs
          npm run build:vercel
          test -s dist/updates/android/latest.json
      - name: Decode owner-controlled keystore into ephemeral workspace
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.EIGHTX8_ANDROID_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASS: ${{ secrets.EIGHTX8_ANDROID_SIGNING_STORE_PASSWORD }}
          RELEASE_ALIAS: ${{ secrets.EIGHTX8_ANDROID_SIGNING_KEY_ALIAS }}
          RELEASE_KEY_PASS: ${{ secrets.EIGHTX8_ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -eu
          test -n "$RELEASE_KEYSTORE_B64"
          test -n "$RELEASE_STORE_PASS"
          test -n "$RELEASE_ALIAS"
          test -n "$RELEASE_KEY_PASS"
          umask 077
          mkdir -p "$RUNNER_TEMP/eightx8-signing"
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/eightx8-signing/owner-release.jks"
          test -s "$RUNNER_TEMP/eightx8-signing/owner-release.jks"
      - name: Produce signed release candidate
        env:
          EIGHTX8_REQUIRE_STABLE_SIGNING: 'true'
          EIGHTX8_ANDROID_SIGNING_KEYSTORE_FILE: ${{ runner.temp }}/eightx8-signing/owner-release.jks
          EIGHTX8_ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.EIGHTX8_ANDROID_SIGNING_STORE_PASSWORD }}
          EIGHTX8_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.EIGHTX8_ANDROID_SIGNING_KEY_ALIAS }}
          EIGHTX8_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.EIGHTX8_ANDROID_SIGNING_KEY_PASSWORD }}
        run: gradle -p android-app --no-daemon clean assembleRelease
      - name: Verify identity, signing certificate and SHA-256
        run: |
          set -eu
          APK="android-app/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt -type f | sort -V | tail -n1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -n1)"
          "$AAPT" dump badging "$APK" | grep -F "package: name='world.eightx8.user'"
          "$APKSIGNER" verify --print-certs "$APK" > "$RUNNER_TEMP/signing-readback.txt"
          if grep -Fq 'CN=Android Debug' "$RUNNER_TEMP/signing-readback.txt"; then exit 1; fi
          mkdir -p android-dist-reviewed
          cp "$APK" android-dist-reviewed/8x8-user-edition-reviewed-stable-signed.apk
          sha256sum android-dist-reviewed/*.apk > android-dist-reviewed/SHA256SUMS.txt
          grep -E 'certificate SHA-256 digest' "$RUNNER_TEMP/signing-readback.txt" > android-dist-reviewed/SIGNER_SHA256.txt
          printf '%s\n' 'REVIEWED_SIGNING_CANDIDATE=YES' 'PUBLIC_DEPLOYMENT=NO' 'MANIFEST_PROMOTION=NO' 'INSTALLATION=NOT_PERFORMED' > android-dist-reviewed/RELEASE_TRUTH.txt
      - uses: actions/upload-artifact@v4
        with:
          name: 8x8-user-edition-reviewed-signed-candidate
          path: android-dist-reviewed/
          if-no-files-found: error
