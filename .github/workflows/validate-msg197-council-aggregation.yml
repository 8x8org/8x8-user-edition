name: Validate MSG197 Council Aggregation

on:
  pull_request:
    paths:
      - "scripts/aggregate_msg197_council_votes_v1.py"
      - "tests/test_msg197_council_aggregator.py"
      - "research/external-capabilities/council/**"
      - "research/external-capabilities/CANDIDATE_STATUS_LEDGER_V3.json"
      - ".github/workflows/validate-msg197-council-aggregation.yml"
  push:
    branches:
      - main
      - feature/msg197-council-aggregation-v1
    paths:
      - "scripts/aggregate_msg197_council_votes_v1.py"
      - "tests/test_msg197_council_aggregator.py"
      - "research/external-capabilities/council/**"
      - "research/external-capabilities/CANDIDATE_STATUS_LEDGER_V3.json"
      - ".github/workflows/validate-msg197-council-aggregation.yml"

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"

jobs:
  validate:
    name: Validate fail-closed council aggregation
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Parse governed JSON
        run: |
          python3 -m json.tool research/external-capabilities/council/COUNCIL_SESSION.json >/dev/null
          python3 -m json.tool research/external-capabilities/council/COUNCIL_VOTE.schema.json >/dev/null
          python3 -m json.tool research/external-capabilities/CANDIDATE_STATUS_LEDGER_V3.json >/dev/null

      - name: Compile aggregator and tests
        run: |
          python3 -m py_compile scripts/aggregate_msg197_council_votes_v1.py
          python3 -m py_compile tests/test_msg197_council_aggregator.py

      - name: Run council aggregation contract tests
        run: python3 -m unittest tests.test_msg197_council_aggregator -v

      - name: Prove empty intake remains zero-vote and blocked
        shell: bash
        run: |
          set -Eeuo pipefail
          empty_dir="$(mktemp -d)"
          output="$(mktemp)"
          trap 'rm -rf "$empty_dir" "$output"' EXIT
          python3 scripts/aggregate_msg197_council_votes_v1.py \
            --votes-dir "$empty_dir" \
            --output "$output" \
            --now 2026-08-05T23:00:00Z
          python3 - "$output" <<'PY'
          import json
          import sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          assert data["valid_vote_count"] == 0
          assert data["quorum_reached"] is False
          assert data["security_veto_active"] is False
          assert data["advancement_allowed"] is False
          assert data["truth_state"] == "QUORUM_PENDING"
          PY

      - name: Enforce zero-network and zero-execution boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          if grep -InE '(requests\.|urllib\.|httpx|socket\.|subprocess\.|os\.system|shell=True|curl|wget|ssh|scp|rsync|pip.*install|npm.*install|docker.*run|kubectl|terraform.*apply|psql|gh.*pr.*merge|vercel.*deploy)' \
            scripts/aggregate_msg197_council_votes_v1.py; then
            echo "Network, shell, install or deployment behavior found in council aggregator"
            exit 1
          fi

      - name: Record governed hashes
        run: |
          sha256sum \
            scripts/aggregate_msg197_council_votes_v1.py \
            tests/test_msg197_council_aggregator.py \
            research/external-capabilities/council/COUNCIL_AGGREGATION_CONTRACT.md \
            research/external-capabilities/council/votes/README.md
