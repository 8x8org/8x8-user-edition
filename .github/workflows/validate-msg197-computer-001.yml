name: Validate MSG197 Cloudflare Computer Safety Review

on:
  pull_request:
    paths:
      - "research/external-capabilities/candidates/cloudflare-computer/**"
      - "scripts/validate_msg197_computer_001.py"
      - ".github/workflows/validate-msg197-computer-001.yml"
  push:
    branches:
      - feature/msg197-computer-001-workspace-safety-v1
    paths:
      - "research/external-capabilities/candidates/cloudflare-computer/**"
      - "scripts/validate_msg197_computer_001.py"
      - ".github/workflows/validate-msg197-computer-001.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python3 -m json.tool research/external-capabilities/candidates/cloudflare-computer/CANDIDATE_MANIFEST.json >/dev/null
      - run: python3 -m json.tool research/external-capabilities/candidates/cloudflare-computer/receipts/MSG197_COMPUTER_001_RECEIPT.json >/dev/null
      - run: python3 scripts/validate_msg197_computer_001.py
