name: Android User Edition V50 APK
on:
  push:
    branches: [main, 'release/**']
    paths:
      - 'android-app/**'
      - 'studio/**'
      - 'agents/**'
      - 'tests/agent-room.test.mjs'
      - 'tests/android-update-contract.test.mjs tests/android-offline-bundle.test.mjs'
      - 'updates/**'
      - 'tests/media-core.test.mjs'
      - 'tests/service-worker.test.mjs'
      - 'scripts/build-vercel-static.mjs'
      - 'vercel.json'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icon.svg'
      - 'v50.html'
      - 'one-fabric-capability-estate-v52.js'
      - 'one-fabric-interaction-estate-v53.js'
      - 'one-fabric-public-transparency-v54.js'
      - 'one-fabric-three-gate-experience-v55.js'
      - '.github/workflows/android-apk-v50.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify public Studio safety and cross-platform static build
        run: |
          node --test tests/media-core.test.mjs tests/service-worker.test.mjs tests/agent-room.test.mjs tests/android-update-contract.test.mjs
          npm run build:vercel
          test -s dist/icon.svg
          test -s dist/sw.js
          test -s dist/updates/android/latest.json
          test -s dist/agents/index.html
          grep -Fq 'data-eightx8-agent-room' dist/index.html
          test -s dist/studio/index.html
          test -s dist/studio/media-core.mjs
          grep -Fq 'data-eightx8-studio-launcher' dist/index.html
          grep -Fq 'media-src' vercel.json
      - name: Build installable development APK and release-unsigned APK
        run: |
          gradle -p android-app --no-daemon clean assembleDebug assemblePreview assembleRelease
          # Preflight: candidate must not reuse existing world.eightx8.user.dev identity.
          AAPT="$(find "${ANDROID_HOME:?}/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -n1)"
          test -x "$AAPT"
          "$AAPT" dump badging android-app/app/build/outputs/apk/preview/app-preview.apk | grep -F "package: name='world.eightx8.user.preview'"
          # Prove on-device routes are APK contents, not merely a separately-built dist.
          jar tf android-app/app/build/outputs/apk/preview/app-preview.apk | grep -Fxq 'assets/index.html'
          jar tf android-app/app/build/outputs/apk/preview/app-preview.apk | grep -Fxq 'assets/studio/index.html'
          jar tf android-app/app/build/outputs/apk/preview/app-preview.apk | grep -Fxq 'assets/agents/index.html'
          jar tf android-app/app/build/outputs/apk/preview/app-preview.apk | grep -Fxq 'assets/studio/media-core.mjs'
          jar tf android-app/app/build/outputs/apk/preview/app-preview.apk | grep -Fxq 'assets/icon.svg'
      - name: Record artifact truth
        run: |
          mkdir -p android-dist
          cp android-app/app/build/outputs/apk/debug/app-debug.apk android-dist/8x8-user-edition-v50-0.2.1-rc1-dev-signed.apk
          cp android-app/app/build/outputs/apk/preview/app-preview.apk android-dist/8x8-user-edition-v50-0.2.1-rc1-side-by-side-preview.apk
          cp android-app/app/build/outputs/apk/release/app-release-unsigned.apk android-dist/8x8-user-edition-v50-0.2.1-rc1-release-unsigned.apk
          sha256sum android-dist/*.apk | tee android-dist/SHA256SUMS.txt
          printf '%s\n' 'DEVELOPMENT_APK=INSTALLABLE_DEBUG_SIGNED_PACKAGE_WORLD_EIGHTX8_USER_DEV' 'SIDE_BY_SIDE_PREVIEW=DEBUG_SIGNED_PACKAGE_WORLD_EIGHTX8_USER_PREVIEW' 'PREVIEW_PRESERVES_INSTALLED_DEV_PACKAGE=TRUE' 'PRODUCTION_APK=NOT_SIGNED_NOT_PUBLISHED_AS_PRODUCTION' > android-dist/RELEASE_TRUTH.txt
      - uses: actions/upload-artifact@v4
        with:
          name: 8x8-user-edition-v50-0.2.1-rc1-apk
          path: android-dist/
          if-no-files-found: error
