name: Publish User Edition V50 Release — FROZEN (no publication)
# ©️8x8 One Fabric / existing workflow path, read-only containment.
# Historical tag v0.2.0 and its four release assets are never modified here.
on:
  push:
    branches: [main]
    paths:
      - 'VERSION.md'
      - 'RELEASE_NOTES_0.2.0.md'
      - 'v50.html'
      - 'android-app/**'
      - '.github/workflows/publish-v50-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-publishing-frozen:
    if: github.repository == '8x8org/8x8-user-edition'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Record non-publishing release freeze receipt
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == '8x8org/8x8-user-edition' ]] || exit 1
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || exit 1
          printf 'V14_RELEASE_PUBLISHING_FROZEN=TRUE\n'
          printf 'RELEASE_CREATION_OR_UPDATE=DENIED\n'
          printf 'HISTORIC_RELEASE=v0.2.0\n'
          printf 'SOURCE_COMMIT=%s\n' "$GITHUB_SHA"
          printf 'TRIGGER_EVENT=%s\n' "$GITHUB_EVENT_NAME"
          printf '%s\n' 'This workflow intentionally performs no publishing action.' >> "$GITHUB_STEP_SUMMARY"
