name: Publish User Edition V50 Release
on:
  push:
    branches: [main]
    paths:
      - 'VERSION.md'
      - 'RELEASE_NOTES_0.2.0.md'
      - 'v50.html'
      - 'android-app/**'
      - '.github/workflows/publish-v50-release.yml'

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == '8x8org/8x8-user-edition'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Validate exact release marker
        run: |
          grep -Fq '0.2.0 Stable · V50' VERSION.md
          grep -Fq 'USER_EDITION_V50_0.2.0' VERSION.md
      - name: Build Android carrier artifacts
        run: |
          gradle -p android-app --no-daemon clean assembleDebug assembleRelease
          mkdir -p release-dist
          cp android-app/app/build/outputs/apk/debug/app-debug.apk release-dist/8x8-user-edition-v50-0.2.0-dev-signed.apk
          cp android-app/app/build/outputs/apk/release/app-release-unsigned.apk release-dist/8x8-user-edition-v50-0.2.0-release-unsigned.apk
          sha256sum release-dist/*.apk | tee release-dist/SHA256SUMS.txt
          printf '%s\n' \
            'DEVELOPMENT_APK=INSTALLABLE_DEBUG_SIGNED' \
            'RELEASE_APK=UNSIGNED_NOT_PRODUCTION_SIGNED' \
            'PRODUCTION_SIGNING=NOT_INFERRED' > release-dist/RELEASE_TRUTH.txt
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.0 >/dev/null 2>&1; then
            gh release upload v0.2.0 release-dist/* --clobber
          else
            gh release create v0.2.0 release-dist/* \
              --target "$GITHUB_SHA" \
              --title '8x8 OS User Edition 0.2.0 · V50' \
              --notes-file RELEASE_NOTES_0.2.0.md
          fi
