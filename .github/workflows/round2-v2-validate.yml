name: Round 2 v2 Validate

on:
  pull_request:
    paths:
      - 'docs/round2/**'
      - 'docs/agent_bridge/**'
      - 'tools/round2_v2_generate_validate.py'
      - '.github/workflows/round2-v2-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  round2-v2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Verify exact candidate head
        run: |
          EXPECTED='${{ github.event.pull_request.head.sha || github.sha }}'
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$EXPECTED"
          echo "EXACT_HEAD=$ACTUAL"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Generate and validate Round 2 v2
        run: |
          python tools/round2_v2_generate_validate.py --out build/round2-v2 | tee build-round2-v2.log
      - name: Show validation summary
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('build/round2-v2/ROUND2_VALIDATION.json')
          if p.exists():
              d=json.loads(p.read_text())
              print('ROUND2_COMPLETE=', d['round2_complete'])
              print('VALIDATION_SCORE=', d['validation_score'])
              print('COMBINED_SHA512=', json.loads(pathlib.Path('build/round2-v2/manifest.json').read_text())['combined_sha512'])
              for c in d['checks']:
                  print(c['check_id'], c['status'], 'expected=', c['expected'], 'observed=', c['observed'])
          else:
              print('ROUND2_VALIDATION.json missing')
          PY
      - name: Upload generated evidence estate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: round2-v2-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/round2-v2/
            build-round2-v2.log
          if-no-files-found: error
          retention-days: 30
