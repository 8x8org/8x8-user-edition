name: SBOM and Provenance

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  sbom-and-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python3 -m pip install pytest
      - name: Run public receipt tests
        run: python3 -m pytest receipts/tests -q
      - name: Generate CycloneDX SBOM
        run: python3 scripts/generate-sbom.py
      - name: Validate SBOM integrity
        run: python3 scripts/validate-sbom.py
      - name: Build release bundle
        run: |
          tar -czf release-assets.tar.gz \
            index.html styles.css app.js manifest.webmanifest \
            icon.svg sw.js state/public-state.json vercel.json \
            sbom.cdx.json receipts/schema/public-receipt-0.0.1.schema.json \
            receipts/verifier.py
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
          if-no-files-found: error
      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ github.sha }}
          path: release-assets.tar.gz
          if-no-files-found: error
      - name: Attest SBOM provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: sbom.cdx.json
      - name: Attest release bundle provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-assets.tar.gz
