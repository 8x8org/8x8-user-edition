name: One-Fabric External Benchmark

on:
  pull_request:
    paths:
      - 'fabric/external_capability_registry/benchmark_2026-08-10.json'
      - 'fabric/external_capability_registry/benchmark_2026-08-11.json'
      - 'fabric/external_capability_registry/benchmark.py'
      - 'fabric/external_capability_registry/test_benchmark.py'
      - 'fabric/external_capability_registry/donor_delta_2026-08-11.json'
      - 'fabric/external_capability_registry/test_donor_delta.py'
      - 'fabric/external_capability_registry/spca_parity_delta_2026-08-11.json'
      - 'fabric/external_capability_registry/test_spca_parity_delta.py'
      - '.github/workflows/one-fabric-external-benchmark.yml'
  push:
    branches: [main]
    paths:
      - 'fabric/external_capability_registry/benchmark_2026-08-10.json'
      - 'fabric/external_capability_registry/benchmark_2026-08-11.json'
      - 'fabric/external_capability_registry/benchmark.py'
      - 'fabric/external_capability_registry/test_benchmark.py'
      - 'fabric/external_capability_registry/donor_delta_2026-08-11.json'
      - 'fabric/external_capability_registry/test_donor_delta.py'
      - 'fabric/external_capability_registry/spca_parity_delta_2026-08-11.json'
      - 'fabric/external_capability_registry/test_spca_parity_delta.py'
      - '.github/workflows/one-fabric-external-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Assert exact candidate head
        shell: bash
        run: |
          set -Eeuo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          observed="$(git rev-parse HEAD)"
          test "$expected" = "$observed"
          printf 'EXPECTED_HEAD=%s\nOBSERVED_HEAD=%s\n' "$expected" "$observed"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Validate benchmark JSON and deterministic scoring
        run: |
          set -Eeuo pipefail
          python3 -m json.tool fabric/external_capability_registry/benchmark_2026-08-10.json >/dev/null
          python3 -m json.tool fabric/external_capability_registry/benchmark_2026-08-11.json >/dev/null
          python3 -m json.tool fabric/external_capability_registry/donor_delta_2026-08-11.json >/dev/null
          python3 -m json.tool fabric/external_capability_registry/spca_parity_delta_2026-08-11.json >/dev/null
          python3 fabric/external_capability_registry/benchmark.py
          python3 -O fabric/external_capability_registry/benchmark.py
          python3 -m unittest \
            fabric.external_capability_registry.test_benchmark \
            fabric.external_capability_registry.test_donor_delta \
            fabric.external_capability_registry.test_spca_parity_delta
